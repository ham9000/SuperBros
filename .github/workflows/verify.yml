name: Verify and publish web

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this branch to the shared GitHub Pages test site
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Browser runtime tests
        run: |
          export CHROME_EXECUTABLE="$(command -v google-chrome)"
          flutter test --platform chrome test/game_runtime_test.dart
      - name: Build the Pages site
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          flutter build web --release --base-href "/${REPOSITORY_NAME}/" --no-web-resources-cdn
          printf '%s\n' "$GITHUB_SHA" > build/web/version.txt
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Upload playable web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
      - name: Package Pages deployment
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/web

  deploy:
    name: Publish verified game
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Report deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Game: %s\n\nRevision: `%s`\n' "$PAGE_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
